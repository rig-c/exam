name: profile results tests
on:
  push:
    branches: [main]
    paths: ['.github/**', 'tools/profile_results.py', 'tools/test_profile_results.py', 'tools/fixtures/**']
  pull_request:
    branches: [main]
    paths: ['.github/**', 'tools/profile_results.py', 'tools/test_profile_results.py', 'tools/fixtures/**']
permissions:
  contents: read
jobs:
  targeted:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m pip install --no-cache-dir -r .github/requirements-profile-tests.txt
      - run: python3 -B -m unittest discover -s tools -p 'test_profile_results.py' -v
