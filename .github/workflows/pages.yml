# The tables in README.md and results/README.md are generated from results/, and advanced/'s from
# advanced/results/. This holds both current.
name: results pages
on:
  push: { branches: [main] }
  pull_request: { branches: [main] }
permissions:
  contents: read
jobs:
  current:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 results.py --check
      - run: python3 advanced/results.py --check
