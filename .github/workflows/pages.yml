# The README summary and results/README.md table are generated from results/, and advanced/'s from
# advanced/results/. This holds both current.
name: results pages
on:
  push: { branches: [main] }
  pull_request: { branches: [main] }
permissions:
  contents: read
jobs:
  current:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 results.py --check
      - run: python3 -B -m unittest discover -s tools -p 'test_results.py'
        env:
          TMPDIR: ${{ runner.temp }}
      - run: python3 -B -m unittest discover -s tools -p 'test_mannequin_docs.py' -v
        env:
          TMPDIR: ${{ runner.temp }}
      - run: python3 -B -m unittest discover -s tools -p 'test_task03_next_repin.py' -v
        env:
          TMPDIR: ${{ runner.temp }}
      - run: python3 -B -m unittest discover -s tools -p 'test_task03_activation.py' -v
        env:
          TMPDIR: ${{ runner.temp }}
      - run: python3 advanced/tools/test_shared.py
        env:
          TMPDIR: ${{ runner.temp }}
      - run: python3 advanced/results.py --check
